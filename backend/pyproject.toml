[project]
name = "prism-backend"
version = "1.8.0"
description = "Backend for Prism: plain-English questions turned into SQL, pandas and charts by a LangGraph agent."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Asad Aslam" }]
# Dependencies live in requirements.txt / requirements-dev.txt. This file only
# carries metadata and tool config; the app is run from source, not installed.

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
ignore = ["E501"]