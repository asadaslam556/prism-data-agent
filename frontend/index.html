<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prism - AI Data Analyst Agent</title>
    <meta
      name="description"
      content="Ask questions about your data in plain English. An agent plans, queries, analyses and charts, and shows its work live."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101828'/%3E%3Ccircle cx='10' cy='10' r='3' fill='%232B50E2'/%3E%3Ccircle cx='22' cy='16' r='3' fill='%2312A150'/%3E%3Ccircle cx='10' cy='22' r='3' fill='%23E8A317'/%3E%3Cpath d='M12.5 11.5 19.5 14.5 M12.5 20.5 19.5 17.5' stroke='%238A94A8' stroke-width='1.6'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Installable as an app on a phone home screen. crossorigin here is not
         decorative: a manifest is fetched without credentials by default, so
         behind the optional APP_USERNAME/APP_PASSWORD login it would 401 and
         the install prompt would silently never appear. -->
    <link
      rel="manifest"
      href="/manifest.webmanifest"
      crossorigin="use-credentials"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#101828" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- iOS ignores the manifest and reads these instead. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Prism" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
